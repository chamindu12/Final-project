<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in | NetLab Control</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #0f172a;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { width: min(380px, 92vw); background: #fff; border-radius: 14px; padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 16px; color: #64748b; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
  button { width: 100%; margin-top: 18px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 11px; font: inherit; cursor: pointer; }
  .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<form class="card" method="post" action="login" autocomplete="off">
  <h1>NetLab Control</h1>
  <p>Admin sign in. Staff and guest accounts do not work here.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input type="text" id="username" name="username" required autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
