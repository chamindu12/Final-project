# Containerized Network Services - core services, dashboard API, hardening
# Start:  docker compose up -d --build
# Stop:   docker compose down

name: netlab

networks:
  lab_net:
    name: lab_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  isolated_net:
    name: isolated_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

services:
  nginx-web:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: nginx-web
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./services/nginx-web/html:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  dnsmasq:
    build: ./services/dns
    image: netlab/dnsmasq:1.0
    container_name: dnsmasq
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.20.0.53
    ports:
      - "127.0.0.1:5353:5353/udp"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 -p 5353 web.lab.local | grep -q 172.20.0.10"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s

  dashboard:
    build: ./dashboard
    image: netlab/dashboard:1.0
    container_name: dashboard
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.20.0.20
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      COMPOSE_PROJECT: netlab
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      nginx-web:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks:
      lab_net:
        ipv4_address: 172.20.0.11
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ./services/reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  isolated-test:
    image: alpine:3.20
    container_name: isolated-test
    command: ["sleep", "infinity"]
    restart: unless-stopped
    user: "65534:65534"
    networks:
      isolated_net:
        ipv4_address: 172.21.0.10
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.1