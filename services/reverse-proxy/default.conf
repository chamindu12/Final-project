# HTTPS-only gateway. Ports 8080/8081/8082 require TLS.
# Monitoring also uses TLS on host ports 3000 and 9090.
ssl_certificate /etc/netlab-tls/netlab.crt;
ssl_certificate_key /etc/netlab-tls/netlab.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:netlab_tls:1m;
ssl_session_tickets off;

# ---------------------------------------------------------------------------
# NetLab gateway. One proxy, three network zones, three listeners.
#   8080  admin plane   dashboard + public web page   (host / lab only)
#   8081  staff portal  staff-portal                   (staff zone + host)
#   8082  guest portal  guest-portal                   (guest zone + host)
# The client's SOURCE ADDRESS decides its zone. Docker gives every zone its own
# subnet, and the gateway addresses (.1) are the machine you browse from ("host").
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

geo $zone {
    default         other;
    172.20.0.0/24   lab;
    172.21.0.0/24   guest;
    172.22.0.0/24   staff;
    127.0.0.1/32    host;
    172.20.0.1/32   host;
    172.21.0.1/32   host;
    172.22.0.1/32   host;
}

map $zone $admin_ok { default 0; host 1; lab 1; }
map $zone $staff_ok { default 0; host 1; staff 1; }
map $zone $guest_ok { default 0; host 1; guest 1; }

# Admin: only exact login POST paths are counted; GET and metrics polling are not.
map "$request_method:$uri" $admin_login_key {
    default "";
    "POST:/login" $binary_remote_addr;
    "POST:/dashboard/login" $binary_remote_addr;
}
limit_req_zone $admin_login_key zone=admin_login:1m rate=30r/m;

# Only POST requests (login, notes, uploads) are counted here; GET has an empty key.
map $request_method $post_key { default ""; POST $binary_remote_addr; }

limit_req_zone $post_key          zone=post_req:1m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=staff_req:2m rate=20r/s;
limit_req_zone $binary_remote_addr zone=guest_req:2m rate=2r/s;
limit_req_status 429;

log_format zonelog '$remote_addr zone=$zone port=$server_port "$request" $status $body_bytes_sent';

# ----------------------------- admin plane -----------------------------------
server {
    listen 8080 ssl;
    server_name _;
    absolute_redirect off;
    default_type text/plain;

    # Only errors generated by this gateway use these pages. Upstream status codes
    # and API/JSON responses pass through unchanged (proxy_intercept_errors is off).
    error_page 413 /__netlab_errors/413.html;
    error_page 429 /__netlab_errors/429.html;
    error_page 502 /__netlab_errors/502.html;
    error_page 503 /__netlab_errors/503.html;
    error_page 504 /__netlab_errors/504.html;
    location ^~ /__netlab_errors/ {
        internal;
        alias /etc/nginx/netlab-errors/;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    access_log /var/log/nginx/access.log zonelog;

    if ($admin_ok = 0) {
        return 403 "admin plane: your network zone is not allowed\n";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Shared per-source limit for /login and /dashboard/login; rejects use HTTP 429.
    limit_req zone=admin_login burst=10 nodelay;

    # The front door: the landing page, served by nginx-web
    location = / {
        resolver 127.0.0.11 valid=10s;
        set $web http://nginx-web:8080;
        rewrite ^ /index.html break;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        resolver 127.0.0.11 valid=10s;
        set $dashboard http://dashboard:5000;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /web {
        return 301 /web/;
    }

    location /web/ {
        resolver 127.0.0.11 valid=10s;
        set $web http://nginx-web:8080;
        rewrite ^/web/(.*)$ /$1 break;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else goes to the dashboard (its own links use relative paths)
    location / {
        resolver 127.0.0.11 valid=10s;
        set $dashboard http://dashboard:5000;
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---------------------------- staff portal -----------------------------------
server {
    listen 8081 ssl;
    server_name _;
    absolute_redirect off;
    default_type text/plain;

    # Only errors generated by this gateway use these pages. Upstream status codes
    # and API/JSON responses pass through unchanged (proxy_intercept_errors is off).
    error_page 413 /__netlab_errors/413.html;
    error_page 429 /__netlab_errors/429.html;
    error_page 502 /__netlab_errors/502.html;
    error_page 503 /__netlab_errors/503.html;
    error_page 504 /__netlab_errors/504.html;
    location ^~ /__netlab_errors/ {
        internal;
        alias /etc/nginx/netlab-errors/;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    access_log /var/log/nginx/access.log zonelog;
    client_max_body_size 21m;

    if ($staff_ok = 0) {
        return 403 "staff portal: your network zone is not allowed\n";
    }

    limit_req zone=staff_req burst=40 nodelay;
    limit_req zone=post_req burst=10 nodelay;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://staff-portal:5000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Zone $zone;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}

# ---------------------------- guest portal -----------------------------------
server {
    listen 8082 ssl;
    server_name _;
    absolute_redirect off;
    default_type text/plain;

    # Only errors generated by this gateway use these pages. Upstream status codes
    # and API/JSON responses pass through unchanged (proxy_intercept_errors is off).
    error_page 413 /__netlab_errors/413.html;
    error_page 429 /__netlab_errors/429.html;
    error_page 502 /__netlab_errors/502.html;
    error_page 503 /__netlab_errors/503.html;
    error_page 504 /__netlab_errors/504.html;
    location ^~ /__netlab_errors/ {
        internal;
        alias /etc/nginx/netlab-errors/;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    access_log /var/log/nginx/access.log zonelog;
    client_max_body_size 64k;

    if ($guest_ok = 0) {
        return 403 "guest portal: your network zone is not allowed\n";
    }

    limit_req zone=guest_req burst=10 nodelay;
    limit_req zone=post_req burst=10 nodelay;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream http://guest-portal:5000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Zone $zone;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
}

# Grafana: host/lab management plane only, same TLS certificate.
server {
    listen 8083 ssl;
    server_name _;
    absolute_redirect off;
    access_log /var/log/nginx/access.log zonelog;
    if ($admin_ok = 0) { return 403; }
    location / {
        resolver 127.0.0.11 valid=10s;
        set $monitor http://grafana:3000;
        proxy_pass $monitor;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# Prometheus: host/lab management plane only, same TLS certificate.
server {
    listen 8084 ssl;
    server_name _;
    absolute_redirect off;
    access_log /var/log/nginx/access.log zonelog;
    if ($admin_ok = 0) { return 403; }
    location / {
        resolver 127.0.0.11 valid=10s;
        set $monitor http://prometheus:9090;
        proxy_pass $monitor;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
