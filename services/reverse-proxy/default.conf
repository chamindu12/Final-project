server {
    listen 8080;
    server_name _;

    absolute_redirect off;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /dashboard/;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location /dashboard/ {
        resolver 127.0.0.11 valid=10s;
        set $dashboard http://dashboard:5000;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # The web server stays reachable through the proxy under /web/
    location = /web {
        return 301 /web/;
    }

    location /web/ {
        resolver 127.0.0.11 valid=10s;
        set $web http://nginx-web:8080;
        rewrite ^/web/(.*)$ /$1 break;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else goes to the dashboard (kept from the current config)
    location / {
        resolver 127.0.0.11 valid=10s;
        set $dashboard http://dashboard:5000;
        proxy_pass $dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}