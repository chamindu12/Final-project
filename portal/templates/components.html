{% macro icon(name, extra="") -%}
<svg class="icon {{ extra }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{% if name == "grid" %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == "shield" %}<path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == "users" %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5v1"/>
{% elif name == "compass" %}<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/>
{% elif name == "check" %}<path d="m5 12 4 4L19 6"/>
{% elif name == "arrow" %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == "help" %}<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 2-2.5 2-2.5 4M12 17h.01"/>
{% elif name == "note" %}<path d="M14 3H5v18h14V8Z"/><path d="M14 3v5h5M8 12h8M8 16h5"/>
{% elif name == "folder" %}<path d="M3 7V5h6l2 3h10v12H3Z"/>
{% elif name == "download" %}<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>
{% elif name == "upload" %}<path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/>
{% elif name == "network" %}<rect x="8" y="3" width="8" height="5" rx="1"/><path d="M12 8v6M5 14h14M5 14v3m14-3v3"/><rect x="2" y="17" width="6" height="4" rx="1"/><rect x="16" y="17" width="6" height="4" rx="1"/>
{% elif name == "lock" %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
{% elif name == "logout" %}<path d="M9 4H4v16h5m5-12 4 4-4 4M9 12h12"/>
{% elif name == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == "info" %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>
{% endif %}</svg>
{%- endmacro %}
