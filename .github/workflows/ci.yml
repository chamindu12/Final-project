name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/dns/Dockerfile
          failure-threshold: warning
          ignore: DL3018

      - name: Lint dashboard Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dashboard/Dockerfile
          failure-threshold: warning

      - name: Lint portal Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: portal/Dockerfile
          failure-threshold: warning

      - name: Lint client Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/client/Dockerfile
          failure-threshold: warning
          ignore: DL3018

      - name: Python lint and unit tests
        run: |
          pip install -r dashboard/requirements.txt -r portal/requirements.txt flake8 pytest
          flake8 dashboard/app.py portal/app.py tests --max-line-length=100
          pytest tests -q

      - name: Check gateway configuration (nginx syntax)
        run: |
          docker run --rm -v "$PWD/services/reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

      - name: Validate monitoring configuration
        run: |
          python3 -m json.tool monitoring/grafana/dashboards/container-network-services.json > /dev/null
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/cfg:ro" \
            prom/prometheus:v3.13.2 check config /cfg/prometheus.yml

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q

  build-and-test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Create .env from example
        run: |
          cp .env.example .env
          socket_gid=$(stat -c '%g' /var/run/docker.sock)
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$socket_gid/" .env

      - name: Build images
        run: docker compose build

      - name: Start stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Show container status
        run: docker compose ps

      - name: Smoke test reverse proxy
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "NetLab Network Services"
          curl -fsS http://localhost:8080/web/ | grep -q "NetLab Network Services"

      - name: Smoke test dashboard sign-in, page and API
        run: |
          base=http://localhost:8080/dashboard
          pair=$(grep '^ADMIN_USERS=' .env | cut -d= -f2- | cut -d, -f1)
          user=${pair%%:*}; pass=${pair#*:}
          curl -fsS $base/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/containers)" = 401
          jar=$(mktemp)
          tok=$(curl -fsS -c "$jar" $base/login | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p')
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" --data-urlencode "csrf_token=$tok" --data-urlencode "username=$user" --data-urlencode "password=wrong" $base/login)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -c "$jar" --data-urlencode "csrf_token=$tok" --data-urlencode "username=$user" --data-urlencode "password=$pass" $base/login)" = 302
          curl -fsS -b "$jar" $base/ | grep -q "NetLab Control"
          curl -fsS -b "$jar" $base/api/containers | grep -q nginx-web
          echo "ADMIN_JAR=$jar" >> "$GITHUB_ENV"

      - name: Check dashboard files are served
        run: |
          check() {
            size=$(curl -fsS "http://localhost:8080/dashboard/static/$1" | wc -c)
            echo "$1: $size bytes"
            [ "$size" -ge "$2" ]
          }
          check vendor/chart.umd.js 150000
          check vendor/bootstrap.min.css 150000
          check js/app.js 5000
          check css/app.css 2000

      - name: Check Prometheus collects metrics
        run: |
          prom() {
            curl -fsS -G --data-urlencode "query=$1" http://localhost:9090/api/v1/query |
              python3 -c "import sys,json; print(json.load(sys.stdin)['data']['result'][0]['value'][1])" || echo 0
          }
          for i in $(seq 1 18); do
            up=$(prom 'sum(up)')
            seen=$(prom 'count(container_memory_working_set_bytes{name="nginx-web"})')
            echo "targets up: $up, nginx-web series: $seen"
            if [ "$up" = "2" ] && [ "$seen" != "0" ]; then exit 0; fi
            sleep 5
          done
          echo "Prometheus did not get the expected metrics"
          curl -s http://localhost:9090/api/v1/targets
          exit 1

      - name: Smoke test dashboard historical chart API
        run: |
          for i in $(seq 1 12); do
            if response=$(curl -fsS -b "$ADMIN_JAR" -G \
              --data-urlencode "name=nginx-web" \
              --data-urlencode "minutes=5" \
              http://localhost:8080/dashboard/api/metrics/history) &&
              printf '%s' "$response" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          samples = data.get("samples", [])
          assert data.get("name") == "nginx-web", data
          assert samples, "Prometheus returned no history samples"
          assert any(sample.get("mem") is not None for sample in samples), samples
          print(f"Received {len(samples)} historical chart samples")
          '; then
              exit 0
            fi
            echo "Waiting for historical samples from Prometheus (attempt $i/12)"
            sleep 5
          done
          echo "Dashboard historical chart API did not return usable metrics"
          exit 1

      - name: Check Grafana provisioning
        run: |
          pw=$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS -u "admin:$pw" http://localhost:3000/api/datasources/uid/prometheus | grep -q '"type":"prometheus"'
          curl -fsS -u "admin:$pw" -G --data-urlencode "query=Container Network Services" \
            http://localhost:3000/api/search | grep -q "Container Network Services"

      - name: Check dashboard monitoring status
        run: curl -fsS -b "$ADMIN_JAR" http://localhost:8080/dashboard/api/monitoring | grep -q '"ok":true'

      - name: Test custom DNS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          dig @127.0.0.1 -p 5353 web.lab.local +short | grep -q 172.20.0.10
          dig @127.0.0.1 -p 5353 proxy.lab.local +short | grep -q 172.20.0.11

      - name: Test network isolation
        run: |
          docker run --rm --network lab_net alpine:3.20 ping -c 2 172.20.0.10
          if docker run --rm --network isolated_net alpine:3.20 ping -c 2 -W 2 172.20.0.10; then
            echo "Isolation is broken: isolated_net can reach lab_net"
            exit 1
          fi

      - name: Scenario policy checks (admin, staff, guest)
        run: bash scripts/scenario-check.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v
